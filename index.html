<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabadou - É sábado meus calabresos!</title>
    <style>
        /* Estilos básicos para manter a página organizada (pode alterar se já tiver o seu CSS) */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .frame img, .ph img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px;
        }
        .rv {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .musica-container {
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <h1>Sabadou!</h1>

    <!-- Secção da Música -->
    <div class="musica-container">
        <p>Ouça a música do Sabadou:</p>
        <audio controls loop>
            <!-- Lembre-se de colocar a sua música na pasta "audio" com este nome exato -->
            <source src="audio/sua-musica.mp3" type="audio/mpeg">
            O seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <!-- Imagem principal (Hero) -->
    <div class="frame" id="frame">
        <!-- Lembre-se de colocar a imagem na pasta "img" -->
        <img src="img/sapo-roxo.jpg" data-i="2" alt="Sabadou, o sapo roxo, com a frase é sábado meus calabresos">
    </div>

    <h2>Quem é o sabadou?</h2>
    
    <!-- Imagens da secção "Quem é o sabadou" -->
    <div class="ph rv">
        <!-- Lembre-se de colocar as imagens na pasta "img" -->
        <img src="img/sabadou-celular.jpg" data-i="7" alt="Sabadou sentado na escada olhando o celular">
        <img src="img/sabadou-pb.jpg" class="av" data-i="8" alt="Sabadou em preto e branco">
    </div>

</body>
</html>
